<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
<style>
  text{font-family:Inter,-apple-system,sans-serif}
  @keyframes sent{0%,60%{opacity:0;transform:scale(.6)}70%,100%{opacity:1;transform:scale(1)}}
  .badge{animation:sent .4s ease 1.4s both}
  @media(prefers-reduced-motion:reduce){.badge{animation:none;opacity:1}}
</style>
<rect width="380" height="240" rx="12" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>

<!-- Phone frame -->
<rect x="200" y="20" width="156" height="200" rx="16" fill="#1a1a1a"/>
<rect x="206" y="30" width="144" height="184" rx="10" fill="#075E54"/>

<!-- WA chat -->
<rect x="206" y="30" width="144" height="32" rx="10" fill="#075E54"/>
<rect x="206" y="52" width="144" height="10" fill="#075E54"/>
<circle cx="222" cy="46" r="8" fill="#128C7E"/>
<text x="222" y="50" font-size="6.5" font-weight="700" fill="#fff" text-anchor="middle">SC</text>
<text x="234" y="43" font-size="8" font-weight="700" fill="#fff">SmileCraft Dental</text>
<text x="234" y="53" font-size="6.5" fill="rgba(255,255,255,.7)">Official account</text>

<!-- WA message -->
<rect x="212" y="68" width="130" height="116" rx="6" fill="#fff"/>
<rect x="212" y="68" width="130" height="20" rx="6" fill="#EBF3FF"/>
<rect x="212" y="80" width="130" height="8" fill="#EBF3FF"/>
<text x="277" y="82" font-size="7.5" font-weight="700" fill="#2170D9" text-anchor="middle">SmileCraft Dental</text>
<text x="218" y="96" font-size="7" font-weight="700" fill="#1a1a1a">Prescription</text>
<text x="218" y="107" font-size="6.5" fill="#737373">Patient: Rahul Mehta</text>
<text x="218" y="116" font-size="6.5" fill="#737373">Date: 5 Jun 2026</text>
<line x1="214" y1="121" x2="336" y2="121" stroke="#e8e8e8" stroke-width="0.8"/>
<text x="218" y="131" font-size="6.5" fill="#1a1a1a">• Amoxicillin 500mg × 5d</text>
<text x="218" y="141" font-size="6.5" fill="#1a1a1a">• Ibuprofen 400mg × 3d</text>
<line x1="214" y1="147" x2="336" y2="147" stroke="#e8e8e8" stroke-width="0.8"/>
<text x="218" y="158" font-size="6.5" fill="#737373">Follow-up in 7 days</text>
<text x="330" y="178" font-size="6" fill="#999" text-anchor="end">10:34 AM</text>
<text x="336" y="178" font-size="8" fill="#2170D9">✓✓</text>

<!-- Sent badge -->
<g class="badge">
  <rect x="288" y="56" width="32" height="32" rx="16" fill="#00C853"/>
  <text x="304" y="76" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">✓</text>
</g>

<!-- Left text -->
<text x="24" y="50" font-size="11" font-weight="700" fill="#1a1a1a" xml:space="preserve">Branded Rx</text>
<text x="24" y="66" font-size="11" font-weight="700" fill="#1a1a1a" xml:space="preserve">on WhatsApp</text>
<text x="24" y="88" font-size="9" fill="#737373" xml:space="preserve">Professional clinic</text>
<text x="24" y="100" font-size="9" fill="#737373">letterhead auto-</text>
<text x="24" y="112" font-size="9" fill="#737373">attached to every</text>
<text x="24" y="124" font-size="9" fill="#737373">prescription.</text>

<rect x="24" y="148" width="130" height="28" rx="6" fill="#EBF3FF"/>
<text x="89" y="166" font-size="9" font-weight="600" fill="#2170D9" text-anchor="middle">Delivered instantly ✓</text>

<text x="24" y="200" font-size="8" fill="#999">Hindi + English templates</text>
<text x="24" y="214" font-size="8" fill="#999">Zero extra cost</text>
</svg>
