<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#1e1b4b"/>
  </linearGradient>
  <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#6d28d9"/>
  </linearGradient>
</defs>
<rect width="360" height="140" fill="url(#bg)"/>

<!-- Title -->
<text x="20" y="30" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif">INDUSTRY REPORT 2025</text>
<text x="20" y="48" font-size="13" font-weight="700" fill="white" font-family="-apple-system,sans-serif">WhatsApp Cost: ₹8,000/mo</text>
<text x="20" y="64" font-size="9" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">Average for Indian dental clinics</text>

<!-- Mini bar chart -->
<rect x="20" y="76" width="280" height="50" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

<!-- Bars: Monthly WhatsApp spend across clinic types -->
<rect x="32" y="114" width="20" height="8" rx="2" fill="url(#bar1)"/>
<rect x="32" y="96" width="20" height="22" rx="2" fill="url(#bar1)" opacity="0.7"/>
<rect x="32" y="84" width="20" height="34" rx="2" fill="url(#bar1)"/>

<rect x="68" y="114" width="20" height="8" rx="2" fill="url(#bar2)"/>
<rect x="68" y="90" width="20" height="28" rx="2" fill="url(#bar2)" opacity="0.7"/>
<rect x="68" y="82" width="20" height="36" rx="2" fill="url(#bar2)"/>

<rect x="104" y="114" width="20" height="8" rx="2" fill="url(#bar1)"/>
<rect x="104" y="100" width="20" height="18" rx="2" fill="url(#bar1)" opacity="0.5"/>
<rect x="104" y="88" width="20" height="30" rx="2" fill="url(#bar1)"/>

<text x="32" y="126" font-size="7" fill="rgba(255,255,255,0.3)" font-family="-apple-system,sans-serif">Solo</text>
<text x="64" y="126" font-size="7" fill="rgba(255,255,255,0.3)" font-family="-apple-system,sans-serif">Group</text>
<text x="100" y="126" font-size="7" fill="rgba(255,255,255,0.3)" font-family="-apple-system,sans-serif">Chain</text>

<!-- Stat callout -->
<rect x="148" y="80" width="140" height="46" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
<text x="158" y="99" font-size="16" font-weight="700" fill="#60a5fa" font-family="-apple-system,sans-serif">200+</text>
<text x="158" y="113" font-size="8" fill="rgba(255,255,255,0.55)" font-family="-apple-system,sans-serif">clinics surveyed · 2025</text>

<!-- Tag -->
<rect x="20" y="130" width="50" height="0" rx="0" fill="none"/>
</svg>
