<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
<style>text{font-family:Inter,-apple-system,sans-serif}</style>
<rect width="380" height="240" rx="12" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>

<text x="24" y="44" font-size="22" font-weight="700" fill="#1a1a1a">Role-Based Access</text>
<text x="24" y="62" font-size="9" fill="#737373">Every team member sees only what they need.</text>

<!-- Owner card -->
<rect x="24" y="76" width="100" height="72" rx="8" fill="#EBF3FF" stroke="#2170D9" stroke-width="1"/>
<circle cx="74" cy="98" r="12" fill="#2170D9"/>
<text x="74" y="102" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">👑</text>
<text x="74" y="116" font-size="8.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Owner</text>
<text x="74" y="126" font-size="7.5" fill="#525252" text-anchor="middle">Full access</text>
<rect x="30" y="138" width="88" height="4" rx="2" fill="#2170D9"/>

<!-- Doctor card -->
<rect x="140" y="76" width="100" height="72" rx="8" fill="#E6FAF0" stroke="#00C853" stroke-width="1"/>
<circle cx="190" cy="98" r="12" fill="#00C853"/>
<text x="190" y="102" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">🩺</text>
<text x="190" y="116" font-size="8.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Doctor</text>
<text x="190" y="126" font-size="7.5" fill="#525252" text-anchor="middle">Patients + Rx</text>
<rect x="146" y="138" width="88" height="4" rx="2" fill="#00C853"/>

<!-- Reception card -->
<rect x="256" y="76" width="100" height="72" rx="8" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
<circle cx="306" cy="98" r="12" fill="#e8e8e8"/>
<text x="306" y="102" font-size="10" font-weight="700" fill="#525252" text-anchor="middle">💁</text>
<text x="306" y="116" font-size="8.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Reception</text>
<text x="306" y="126" font-size="7.5" fill="#525252" text-anchor="middle">Bookings only</text>
<rect x="262" y="138" width="40" height="4" rx="2" fill="#e8e8e8"/>

<text x="24" y="184" font-size="8.5" fill="#737373">Invite staff with one link · No extra seats cost · Audit log included</text>
<rect x="24" y="196" width="154" height="28" rx="6" fill="#EBF3FF"/>
<text x="101" y="214" font-size="9" font-weight="600" fill="#2170D9" text-anchor="middle">Manage your team →</text>
</svg>
