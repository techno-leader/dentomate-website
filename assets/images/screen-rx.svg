<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
<defs>
  <linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <clipPath id="phone-clip">
    <rect x="500" y="20" width="200" height="300" rx="20"/>
  </clipPath>
</defs>

<!-- Background -->
<rect width="720" height="340" fill="#0f172a"/>

<!-- ── Left panel: Form ──────────────────────────────── -->
<rect x="16" y="16" width="468" height="308" rx="10" fill="#1e293b"/>

<!-- Header -->
<rect x="16" y="16" width="468" height="44" rx="10" fill="#1e293b"/>
<rect x="16" y="46" width="468" height="14" fill="#1e293b"/>
<rect x="32" y="28" width="4" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
<text x="44" y="34" font-size="11" font-weight="700" fill="white" font-family="-apple-system,sans-serif">New Prescription — SmileCraft Dental</text>

<!-- Patient banner -->
<rect x="28" y="68" width="440" height="40" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
<circle cx="48" cy="88" r="10" fill="rgba(59,130,246,0.2)"/>
<text x="44" y="92" font-size="8.5" font-weight="700" fill="#93c5fd" font-family="-apple-system,sans-serif">RM</text>
<text x="66" y="85" font-size="10.5" font-weight="700" fill="white" font-family="-apple-system,sans-serif">Rahul Mehta</text>
<text x="66" y="99" font-size="8.5" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif">Root Canal · +91 98765 43210 · Reg# DM-1042</text>
<rect x="386" y="76" width="68" height="24" rx="6" fill="rgba(37,211,102,0.12)" stroke="rgba(37,211,102,0.25)" stroke-width="1"/>
<text x="394" y="92" font-size="8.5" font-weight="700" fill="#4ade80" font-family="-apple-system,sans-serif">WhatsApp ✓</text>

<!-- Diagnosis -->
<text x="32" y="128" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">DIAGNOSIS &amp; CHIEF COMPLAINT</text>
<rect x="32" y="134" width="440" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="44" y="157" font-size="9.5" fill="rgba(255,255,255,0.7)" font-family="-apple-system,sans-serif">Acute pulpitis — mandibular first molar (tooth #36). Root canal therapy initiated.</text>

<!-- Medicines -->
<text x="32" y="190" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">MEDICATIONS</text>

<!-- Med row 1 -->
<rect x="32" y="196" width="440" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="44" y="213" font-size="9.5" font-weight="600" fill="white" font-family="-apple-system,sans-serif">Amoxicillin 500mg</text>
<text x="200" y="213" font-size="9" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif">1 cap  ×  3/day  ×  5 days</text>
<text x="400" y="213" font-size="9" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">After food</text>

<!-- Med row 2 -->
<rect x="32" y="232" width="440" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="44" y="249" font-size="9.5" font-weight="600" fill="white" font-family="-apple-system,sans-serif">Ibuprofen 400mg</text>
<text x="200" y="249" font-size="9" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif">1 tab  ×  3/day  ×  3 days</text>
<text x="400" y="249" font-size="9" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">After food</text>

<!-- Notes -->
<text x="32" y="278" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">FOLLOW-UP NOTE</text>
<rect x="32" y="284" width="440" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="44" y="301" font-size="9" fill="rgba(255,255,255,0.55)" font-family="-apple-system,sans-serif">Return in 7 days for second sitting. Avoid hard food. Call if severe pain.</text>

<!-- Send button -->
<rect x="32" y="316" width="200" height="32" rx="8" fill="url(#brandG)"/>
<text x="80" y="337" font-size="10" font-weight="700" fill="white" font-family="-apple-system,sans-serif">Send on WhatsApp</text>
<!-- Send icon -->
<path d="M56 332l6-6 6 6M62 326v12" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Sent animation overlay -->
<rect x="32" y="316" width="200" height="32" rx="8" fill="#059669" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
</rect>
<text x="72" y="337" font-size="10" font-weight="700" fill="white" font-family="-apple-system,sans-serif" opacity="0">
  ✓ Prescription Sent!
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
</text>

<!-- ── Right panel: Phone preview ─────────────────── -->
<!-- Phone frame -->
<rect x="500" y="14" width="204" height="312" rx="22" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
<rect x="504" y="18" width="196" height="304" rx="18" fill="#f8fafc"/>

<!-- Phone notch -->
<rect x="576" y="20" width="52" height="8" rx="4" fill="#1e293b"/>

<!-- WhatsApp preview header -->
<rect x="504" y="30" width="196" height="44" fill="#128c7e"/>
<circle cx="524" cy="52" r="10" fill="rgba(255,255,255,0.2)"/>
<text x="520" y="56" font-size="8" font-weight="700" fill="white" font-family="-apple-system,sans-serif">SC</text>
<text x="538" y="48" font-size="9.5" font-weight="700" fill="white" font-family="-apple-system,sans-serif">SmileCraft Dental</text>
<text x="538" y="62" font-size="7.5" fill="rgba(255,255,255,0.7)" font-family="-apple-system,sans-serif">Official clinic account</text>

<!-- Chat background -->
<rect x="504" y="74" width="196" height="248" fill="#e5ddd5" opacity="0.5"/>
<rect x="504" y="74" width="196" height="248" fill="white" opacity="0.6"/>

<!-- Message bubble -->
<rect x="514" y="86" width="176" height="190" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>

<!-- Clinic logo bar inside message -->
<rect x="514" y="86" width="176" height="28" rx="10" fill="#eff6ff"/>
<rect x="514" y="104" width="176" height="10" fill="#eff6ff"/>
<text x="540" y="105" font-size="9" font-weight="700" fill="#1d4ed8" font-family="-apple-system,sans-serif">SmileCraft Dental</text>
<circle cx="524" cy="99" r="7" fill="#dbeafe"/>
<text x="520" y="103" font-size="6" font-weight="700" fill="#1d4ed8" font-family="-apple-system,sans-serif">SC</text>

<!-- Prescription content in bubble -->
<text x="522" y="126" font-size="9" font-weight="700" fill="#0f172a" font-family="-apple-system,sans-serif">Prescription</text>
<line x1="522" y1="130" x2="682" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="522" y="143" font-size="8" fill="#374151" font-family="-apple-system,sans-serif">Patient: Rahul Mehta</text>
<text x="522" y="155" font-size="8" fill="#374151" font-family="-apple-system,sans-serif">Date: 5 Jun 2026</text>
<text x="522" y="167" font-size="8" fill="#374151" font-family="-apple-system,sans-serif">Diagnosis: Acute pulpitis</text>
<line x1="522" y1="172" x2="682" y2="172" stroke="#f1f5f9" stroke-width="0.8"/>
<text x="522" y="184" font-size="7.5" font-weight="700" fill="#64748b" font-family="-apple-system,sans-serif">MEDICATIONS</text>
<text x="522" y="196" font-size="8" fill="#0f172a" font-family="-apple-system,sans-serif">• Amoxicillin 500mg — 3×/day, 5 days</text>
<text x="522" y="208" font-size="8" fill="#0f172a" font-family="-apple-system,sans-serif">• Ibuprofen 400mg — 3×/day, 3 days</text>
<line x1="522" y1="214" x2="682" y2="214" stroke="#f1f5f9" stroke-width="0.8"/>
<text x="522" y="225" font-size="7.5" fill="#64748b" font-family="-apple-system,sans-serif">Follow-up in 7 days</text>
<!-- Doctor signature area -->
<rect x="522" y="232" width="80" height="18" rx="4" fill="#f8fafc"/>
<text x="530" y="244" font-size="7" fill="#94a3b8" font-family="-apple-system,sans-serif">Dr. Arjun Mehta</text>
<text x="530" y="254" font-size="6" fill="#cbd5e1" font-family="-apple-system,sans-serif">BDS, MDS · Reg #12345</text>

<!-- WhatsApp ticks (blue double tick = read) -->
<text x="672" y="278" font-size="8" fill="#53bdeb" font-family="-apple-system,sans-serif">✓✓</text>
<text x="618" y="278" font-size="7.5" fill="#94a3b8" font-family="-apple-system,sans-serif">10:34 AM</text>

<!-- Animated: tick appears then turns blue -->
<text x="672" y="278" font-size="8" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif" opacity="0">
  ✓✓
  <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3;0.5;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
</text>

</svg>
