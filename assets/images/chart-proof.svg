<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
<defs>
  <linearGradient id="before" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94a3b8"/>
    <stop offset="100%" stop-color="#64748b"/>
  </linearGradient>
  <linearGradient id="after" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
</defs>
<rect width="560" height="320" fill="#f8fafc" rx="12"/>

<!-- Title -->
<text x="24" y="36" font-size="14" font-weight="700" fill="#0f172a" font-family="-apple-system,sans-serif">Patient Return Rate</text>
<text x="24" y="54" font-size="10" fill="#64748b" font-family="-apple-system,sans-serif">Before Dentomate vs After · 90-day pilot, 3 clinics</text>

<!-- Legend -->
<rect x="380" y="24" width="10" height="10" rx="2" fill="#94a3b8"/>
<text x="394" y="34" font-size="9" fill="#64748b" font-family="-apple-system,sans-serif">Before</text>
<rect x="440" y="24" width="10" height="10" rx="2" fill="#3b82f6"/>
<text x="454" y="34" font-size="9" fill="#3b82f6" font-weight="600" font-family="-apple-system,sans-serif">After</text>

<!-- Y axis labels -->
<text x="24" y="272" font-size="9" fill="#94a3b8" font-family="-apple-system,sans-serif">0%</text>
<text x="14" y="234" font-size="9" fill="#94a3b8" font-family="-apple-system,sans-serif">20%</text>
<text x="14" y="194" font-size="9" fill="#94a3b8" font-family="-apple-system,sans-serif">40%</text>
<text x="14" y="154" font-size="9" fill="#94a3b8" font-family="-apple-system,sans-serif">60%</text>
<text x="14" y="114" font-size="9" fill="#94a3b8" font-family="-apple-system,sans-serif">80%</text>

<!-- Grid lines -->
<line x1="54" y1="270" x2="530" y2="270" stroke="#e2e8f0" stroke-width="1"/>
<line x1="54" y1="232" x2="530" y2="232" stroke="#e2e8f0" stroke-width="0.5"/>
<line x1="54" y1="192" x2="530" y2="192" stroke="#e2e8f0" stroke-width="0.5"/>
<line x1="54" y1="152" x2="530" y2="152" stroke="#e2e8f0" stroke-width="0.5"/>
<line x1="54" y1="112" x2="530" y2="112" stroke="#e2e8f0" stroke-width="0.5"/>

<!-- Clinic 1: SmileCraft Mumbai -->
<!-- Before: 46% return rate = 92px tall from base -->
<rect x="80" y="270" width="40" height="0" rx="4" fill="url(#before)">
  <animate attributeName="height" from="0" to="92" dur="0.7s" begin="0.1s" fill="freeze"/>
  <animate attributeName="y" from="270" to="178" dur="0.7s" begin="0.1s" fill="freeze"/>
</rect>
<!-- After: 60% = 120px -->
<rect x="124" y="270" width="40" height="0" rx="4" fill="url(#after)">
  <animate attributeName="height" from="0" to="120" dur="0.7s" begin="0.4s" fill="freeze"/>
  <animate attributeName="y" from="270" to="150" dur="0.7s" begin="0.4s" fill="freeze"/>
</rect>
<!-- +30% label -->
<text x="92" y="138" font-size="9" font-weight="700" fill="#3b82f6" font-family="-apple-system,sans-serif" opacity="0">+30%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/></text>
<text x="72" y="284" font-size="8.5" fill="#374151" font-family="-apple-system,sans-serif">Mumbai</text>

<!-- Clinic 2: SmileCraft Delhi -->
<rect x="220" y="270" width="40" height="0" rx="4" fill="url(#before)">
  <animate attributeName="height" from="0" to="84" dur="0.7s" begin="0.2s" fill="freeze"/>
  <animate attributeName="y" from="270" to="186" dur="0.7s" begin="0.2s" fill="freeze"/>
</rect>
<rect x="264" y="270" width="40" height="0" rx="4" fill="url(#after)">
  <animate attributeName="height" from="0" to="112" dur="0.7s" begin="0.5s" fill="freeze"/>
  <animate attributeName="y" from="270" to="158" dur="0.7s" begin="0.5s" fill="freeze"/>
</rect>
<text x="232" y="146" font-size="9" font-weight="700" fill="#3b82f6" font-family="-apple-system,sans-serif" opacity="0">+28%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
<text x="222" y="284" font-size="8.5" fill="#374151" font-family="-apple-system,sans-serif">Delhi</text>

<!-- Clinic 3: Bengaluru -->
<rect x="360" y="270" width="40" height="0" rx="4" fill="url(#before)">
  <animate attributeName="height" from="0" to="88" dur="0.7s" begin="0.3s" fill="freeze"/>
  <animate attributeName="y" from="270" to="182" dur="0.7s" begin="0.3s" fill="freeze"/>
</rect>
<rect x="404" y="270" width="40" height="0" rx="4" fill="url(#after)">
  <animate attributeName="height" from="0" to="116" dur="0.7s" begin="0.6s" fill="freeze"/>
  <animate attributeName="y" from="270" to="154" dur="0.7s" begin="0.6s" fill="freeze"/>
</rect>
<text x="370" y="142" font-size="9" font-weight="700" fill="#3b82f6" font-family="-apple-system,sans-serif" opacity="0">+32%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.2s" fill="freeze"/></text>
<text x="356" y="284" font-size="8.5" fill="#374151" font-family="-apple-system,sans-serif">Bengaluru</text>

<!-- Average badge -->
<rect x="176" y="295" width="210" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="200" y="309" font-size="9" font-weight="700" fill="#1d4ed8" font-family="-apple-system,sans-serif">Avg +30% return rate across pilot</text>

</svg>
