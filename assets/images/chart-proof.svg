<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
<style>
  text{font-family:Inter,-apple-system,sans-serif}
  @keyframes growBar{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
  .bar{animation:growBar .6s ease-out both}
  .b1{animation-delay:.1s}.b2{animation-delay:.25s}.b3{animation-delay:.4s}.b4{animation-delay:.15s}.b5{animation-delay:.3s}.b6{animation-delay:.45s}
  @media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect width="560" height="320" rx="12" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>

<text x="24" y="30" font-size="13" font-weight="700" fill="#1a1a1a">Pilot Results — 3 Clinics, 90 Days</text>
<text x="24" y="46" font-size="9" fill="#737373">No-show rate before vs. after Dentomate (avg. across Mumbai, Delhi, Bangalore)</text>

<!-- Legend -->
<rect x="380" y="18" width="12" height="12" rx="2" fill="#e8e8e8"/>
<text x="396" y="28" font-size="8.5" fill="#737373">Before</text>
<rect x="448" y="18" width="12" height="12" rx="2" fill="#2170D9"/>
<text x="464" y="28" font-size="8.5" fill="#737373">After</text>

<!-- Chart area -->
<rect x="24" y="58" width="512" height="210" rx="8" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>

<!-- Grid -->
<line x1="64" y1="68" x2="64" y2="252" stroke="#e8e8e8" stroke-width="1"/>
<line x1="64" y1="252" x2="524" y2="252" stroke="#e8e8e8" stroke-width="1"/>
<line x1="64" y1="212" x2="524" y2="212" stroke="#e8e8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
<line x1="64" y1="172" x2="524" y2="172" stroke="#e8e8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
<line x1="64" y1="132" x2="524" y2="132" stroke="#e8e8e8" stroke-width="0.5" stroke-dasharray="4,4"/>
<line x1="64" y1="92" x2="524" y2="92" stroke="#e8e8e8" stroke-width="0.5" stroke-dasharray="4,4"/>

<text x="58" y="256" font-size="7" fill="#999" text-anchor="end">0%</text>
<text x="58" y="216" font-size="7" fill="#999" text-anchor="end">10%</text>
<text x="58" y="176" font-size="7" fill="#999" text-anchor="end">20%</text>
<text x="58" y="136" font-size="7" fill="#999" text-anchor="end">30%</text>
<text x="58" y="96" font-size="7" fill="#999" text-anchor="end">40%</text>

<!-- SmileCraft Mumbai -->
<text x="162" y="270" font-size="8" fill="#737373" text-anchor="middle">SmileCraft Mumbai</text>
<!-- Before: 32% → height 128 -->
<rect x="104" y="124" width="44" height="128" rx="3" fill="#f0f0f0" class="bar b1"/>
<text x="126" y="120" font-size="8" fill="#737373" text-anchor="middle">32%</text>
<!-- After: 22% → height 88 -->
<rect x="152" y="164" width="44" height="88" rx="3" fill="#2170D9" class="bar b2"/>
<text x="174" y="160" font-size="8" font-weight="700" fill="#2170D9" text-anchor="middle">22%</text>
<text x="162" y="284" font-size="8.5" font-weight="700" fill="#00C853" text-anchor="middle">↓ 30%</text>

<!-- Pearl Delhi -->
<text x="320" y="270" font-size="8" fill="#737373" text-anchor="middle">Pearl Dental Delhi</text>
<!-- Before: 28% → 112 -->
<rect x="260" y="140" width="44" height="112" rx="3" fill="#f0f0f0" class="bar b3"/>
<text x="282" y="136" font-size="8" fill="#737373" text-anchor="middle">28%</text>
<!-- After: 20% → 80 -->
<rect x="308" y="172" width="44" height="80" rx="3" fill="#2170D9" class="bar b4"/>
<text x="330" y="168" font-size="8" font-weight="700" fill="#2170D9" text-anchor="middle">20%</text>
<text x="320" y="284" font-size="8.5" font-weight="700" fill="#00C853" text-anchor="middle">↓ 28%</text>

<!-- Apex Bangalore -->
<text x="476" y="270" font-size="8" fill="#737373" text-anchor="middle">Apex Care Bangalore</text>
<!-- Before: 36% → 144 -->
<rect x="416" y="108" width="44" height="144" rx="3" fill="#f0f0f0" class="bar b5"/>
<text x="438" y="104" font-size="8" fill="#737373" text-anchor="middle">36%</text>
<!-- After: 24% → 96 -->
<rect x="464" y="156" width="44" height="96" rx="3" fill="#2170D9" class="bar b6"/>
<text x="486" y="152" font-size="8" font-weight="700" fill="#2170D9" text-anchor="middle">24%</text>
<text x="476" y="284" font-size="8.5" font-weight="700" fill="#00C853" text-anchor="middle">↓ 32%</text>

<text x="24" y="308" font-size="8" fill="#999">No-show rate = appointments missed without cancellation · Data from pilot Jan–Mar 2026</text>
</svg>
