<text x="24" y="50" font-size="9" fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">32 patients due for recall · 8 overdue</text>

<!-- Filter tabs -->
<rect x="24" y="62" width="80" height="26" rx="6" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
<text x="35" y="80" font-size="9.5" font-weight="700" fill="#93c5fd" font-family="-apple-system,sans-serif">This Week</text>
<rect x="112" y="62" width="82" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
