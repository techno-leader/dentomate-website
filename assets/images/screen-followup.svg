<text x="40" y="118" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.35)" font-family="-apple-system,sans-serif">PATIENT</text>
<text x="240" y="118" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.35)" font-family="-apple-system,sans-serif">LAST TREATMENT</text>
