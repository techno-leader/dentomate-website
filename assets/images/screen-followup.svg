<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
<style>
  text{font-family:Inter,-apple-system,sans-serif}
  @keyframes sendBtn{0%,70%{fill:#2170D9}80%,100%{fill:#00C853}}
  @keyframes checkmark{0%,70%{opacity:0}80%,100%{opacity:1}}
  .send-btn{animation:sendBtn 3s ease 1.5s infinite}
  .sent-check{animation:checkmark 3s ease 1.5s infinite}
  @media(prefers-reduced-motion:reduce){.send-btn{animation:none}.sent-check{animation:none;opacity:0}}
</style>
<rect width="720" height="340" fill="#fafafa" rx="8"/>
<rect x="0" y="0" width="720" height="340" fill="#ffffff" rx="8"/>

<!-- Header -->
<line x1="0" y1="48" x2="720" y2="48" stroke="#e8e8e8" stroke-width="1"/>
<text x="16" y="24" font-size="13" font-weight="700" fill="#1a1a1a">Recall Queue</text>
<text x="16" y="38" font-size="8.5" fill="#999">4 patients due for follow-up today</text>
<rect x="604" y="12" width="100" height="24" rx="6" fill="#2170D9"/>
<text x="654" y="28" font-size="9.5" font-weight="600" fill="#fff" text-anchor="middle">Send All</text>

<!-- Column headers -->
<rect x="0" y="48" width="720" height="28" fill="#fafafa"/>
<line x1="0" y1="76" x2="720" y2="76" stroke="#e8e8e8" stroke-width="1"/>
<text x="16" y="66" font-size="8" font-weight="700" fill="#737373" letter-spacing="0.06em">PATIENT</text>
<text x="320" y="66" font-size="8" font-weight="700" fill="#737373" letter-spacing="0.06em">DUE</text>
<text x="450" y="66" font-size="8" font-weight="700" fill="#737373" letter-spacing="0.06em">TYPE</text>
<text x="600" y="66" font-size="8" font-weight="700" fill="#737373" letter-spacing="0.06em">ACTION</text>

<!-- Row 1 — animated send -->
<rect x="0" y="76" width="720" height="56" fill="#ffffff"/>
<line x1="0" y1="132" x2="720" y2="132" stroke="#f0f0f0" stroke-width="1"/>
<circle cx="32" cy="104" r="14" fill="#EBF3FF"/>
<text x="32" y="108" font-size="9" font-weight="700" fill="#2170D9" text-anchor="middle">PS</text>
<text x="54" y="99" font-size="10" font-weight="600" fill="#1a1a1a">Priya Sharma</text>
<text x="54" y="112" font-size="8.5" fill="#737373">+91 98765 11111</text>
<rect x="304" y="94" width="72" height="18" rx="9" fill="#FEF3C7"/>
<text x="340" y="106" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">7-day recall</text>
<text x="450" y="104" font-size="9" fill="#525252">Post Root Canal</text>
<rect x="590" y="92" width="80" height="24" rx="6" class="send-btn"/>
<text x="630" y="108" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Send Msg</text>
<text x="630" y="108" font-size="9" font-weight="600" fill="#fff" text-anchor="middle" class="sent-check">✓ Sent</text>

<!-- Row 2 -->
<rect x="0" y="132" width="720" height="56" fill="#ffffff"/>
<line x1="0" y1="188" x2="720" y2="188" stroke="#f0f0f0" stroke-width="1"/>
<circle cx="32" cy="160" r="14" fill="#E6FAF0"/>
<text x="32" y="164" font-size="9" font-weight="700" fill="#00C853" text-anchor="middle">AK</text>
<text x="54" y="155" font-size="10" font-weight="600" fill="#1a1a1a">Anjali Kapoor</text>
<text x="54" y="168" font-size="8.5" fill="#737373">+91 98765 22222</text>
<rect x="304" y="150" width="76" height="18" rx="9" fill="#EBF3FF"/>
<text x="342" y="162" font-size="8" font-weight="600" fill="#2170D9" text-anchor="middle">90-day recall</text>
<text x="450" y="160" font-size="9" fill="#525252">Post Cleaning</text>
<rect x="590" y="148" width="80" height="24" rx="6" fill="#EBF3FF" stroke="#2170D9" stroke-width="1"/>
<text x="630" y="164" font-size="9" font-weight="600" fill="#2170D9" text-anchor="middle">Send Msg</text>

<!-- Row 3 -->
<rect x="0" y="188" width="720" height="56" fill="#ffffff"/>
<line x1="0" y1="244" x2="720" y2="244" stroke="#f0f0f0" stroke-width="1"/>
<circle cx="32" cy="216" r="14" fill="#FEF3C7"/>
<text x="32" y="220" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">SP</text>
<text x="54" y="211" font-size="10" font-weight="600" fill="#1a1a1a">Suresh Patel</text>
<text x="54" y="224" font-size="8.5" fill="#737373">+91 98765 33333</text>
<rect x="304" y="206" width="80" height="18" rx="9" fill="#E6FAF0"/>
<text x="344" y="218" font-size="8" font-weight="600" fill="#00C853" text-anchor="middle">6-month recall</text>
<text x="450" y="216" font-size="9" fill="#525252">Post Extraction</text>
<rect x="590" y="204" width="80" height="24" rx="6" fill="#EBF3FF" stroke="#2170D9" stroke-width="1"/>
<text x="630" y="220" font-size="9" font-weight="600" fill="#2170D9" text-anchor="middle">Send Msg</text>

<!-- Row 4 — overdue -->
<rect x="0" y="244" width="720" height="56" fill="#fff8f8"/>
<line x1="0" y1="300" x2="720" y2="300" stroke="#f0f0f0" stroke-width="1"/>
<circle cx="32" cy="272" r="14" fill="#FEE2E2"/>
<text x="32" y="276" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">MJ</text>
<text x="54" y="267" font-size="10" font-weight="600" fill="#1a1a1a">Meera Joshi</text>
<text x="54" y="280" font-size="8.5" fill="#737373">+91 98765 44444</text>
<rect x="304" y="262" width="64" height="18" rx="9" fill="#FEE2E2"/>
<text x="336" y="274" font-size="8" font-weight="600" fill="#DC2626" text-anchor="middle">Overdue</text>
<text x="450" y="272" font-size="9" fill="#525252">Annual Checkup</text>
<rect x="590" y="260" width="80" height="24" rx="6" fill="#DC2626"/>
<text x="630" y="276" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Send Now!</text>

<!-- Footer stats -->
<rect x="0" y="300" width="720" height="40" fill="#fafafa"/>
<line x1="0" y1="300" x2="720" y2="300" stroke="#e8e8e8" stroke-width="1"/>
<text x="16" y="322" font-size="9" fill="#737373">3 messages sent this week · 94% open rate · Avg reply time: 4 min</text>
</svg>
