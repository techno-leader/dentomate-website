<rect x="238" y="112" width="148" height="80" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<text x="254" y="136" font-size="26" font-weight="700" fill="#2170D9">94%</text>
<text x="254" y="150" font-size="8.5" fill="#737373">WhatsApp delivery rate</text>
<text x="254" y="164" font-size="8" fill="#999">Prescriptions reach patients</text>
<text x="254" y="178" font-size="8" fill="#999">instantly, every time</text>

<!-- Quote -->
<rect x="400" y="20" width="160" height="180" rx="8" fill="#EBF3FF" stroke="#2170D9" stroke-width="1"/>
<text x="420" y="50" font-size="24" fill="#2170D9">"</text>
