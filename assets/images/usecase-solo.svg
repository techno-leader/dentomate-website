<rect x="32" y="166" width="156" height="24" rx="5" fill="#EBF3FF"/>
<text x="110" y="182" font-size="8.5" font-weight="600" fill="#2170D9" text-anchor="middle">Set up in 5 minutes ✓</text>

<!-- Stats -->
<rect x="238" y="20" width="148" height="80" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
