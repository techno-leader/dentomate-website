<text x="416" y="94" font-size="8.5" fill="#1a1a1a">Dentomate handles</text>
<text x="416" y="107" font-size="8.5" fill="#1a1a1a">it automatically.</text>
<text x="416" y="120" font-size="8.5" font-weight="700" fill="#2170D9">Now I focus on</text>
<text x="416" y="133" font-size="8.5" font-weight="700" fill="#2170D9">my patients."</text>
<line x1="412" y1="145" x2="548" y2="145" stroke="#2170D9" stroke-width="0.5" stroke-opacity="0.3"/>
<circle cx="428" cy="164" r="10" fill="#2170D9"/>
<text x="428" y="168" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">AM</text>
<text x="444" y="161" font-size="8" font-weight="700" fill="#1a1a1a">Dr. Arjun Mehta</text>
<text x="444" y="172" font-size="7.5" fill="#737373">Solo clinic, Mumbai</text>
<text x="416" y="192" font-size="7.5" fill="#00C853">⭐⭐⭐⭐⭐  Verified user</text>
