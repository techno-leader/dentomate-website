<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220">
<style>text{font-family:Inter,-apple-system,sans-serif}</style>
<rect width="580" height="220" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>

<!-- Central hub -->
<circle cx="200" cy="110" r="44" fill="#EBF3FF" stroke="#2170D9" stroke-width="2"/>
<text x="200" y="105" font-size="9" font-weight="700" fill="#2170D9" text-anchor="middle">Dentomate</text>
<text x="200" y="118" font-size="8" fill="#2170D9" text-anchor="middle">Central Hub</text>
<text x="200" y="130" font-size="7.5" fill="#525252" text-anchor="middle">All branches</text>

<!-- Branch nodes + connectors -->
<line x1="200" y1="66" x2="200" y2="30" stroke="#2170D9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<rect x="150" y="16" width="100" height="28" rx="6" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<text x="200" y="34" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle">Mumbai Central</text>

<line x1="244" y1="110" x2="344" y2="70" stroke="#2170D9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<rect x="316" y="54" width="100" height="28" rx="6" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<text x="366" y="72" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle">Delhi South</text>

<line x1="244" y1="120" x2="344" y2="150" stroke="#2170D9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<rect x="316" y="136" width="100" height="28" rx="6" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<text x="366" y="154" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle">Bangalore HSR</text>

<line x1="200" y1="154" x2="200" y2="190" stroke="#2170D9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<rect x="150" y="176" width="100" height="28" rx="6" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<text x="200" y="194" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle">Pune Kothrud</text>

<!-- Dashboard snapshot -->
<rect x="430" y="16" width="134" height="188" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
<rect x="430" y="16" width="134" height="32" rx="8" fill="#fafafa"/>
<rect x="430" y="40" width="134" height="8" fill="#fafafa"/>
<line x1="430" y1="48" x2="564" y2="48" stroke="#e8e8e8" stroke-width="1"/>
<text x="497" y="36" font-size="9" font-weight="700" fill="#1a1a1a" text-anchor="middle">All Branches</text>

<text x="440" y="64" font-size="7.5" fill="#737373">Total Revenue</text>
<text x="440" y="76" font-size="13" font-weight="700" fill="#1a1a1a">₹14.4L</text>
<text x="440" y="87" font-size="7" fill="#00C853">↑ 28% overall</text>

<line x1="436" y1="94" x2="558" y2="94" stroke="#f0f0f0" stroke-width="1"/>
<text x="440" y="108" font-size="7.5" fill="#737373">Active Patients</text>
<text x="440" y="120" font-size="13" font-weight="700" fill="#1a1a1a">842</text>

<line x1="436" y1="128" x2="558" y2="128" stroke="#f0f0f0" stroke-width="1"/>
<text x="440" y="142" font-size="7.5" fill="#737373">Rx Sent</text>
<text x="440" y="154" font-size="13" font-weight="700" fill="#1a1a1a">1,204</text>

<line x1="436" y1="162" x2="558" y2="162" stroke="#f0f0f0" stroke-width="1"/>
<text x="440" y="176" font-size="7.5" fill="#737373">Staff Accounts</text>
<text x="440" y="188" font-size="13" font-weight="700" fill="#1a1a1a">12</text>

<rect x="438" y="196" width="118" height="0" rx="0" fill="none"/>
</svg>
