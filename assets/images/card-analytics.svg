<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
<style>
  text{font-family:Inter,-apple-system,sans-serif}
  @keyframes growBar{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
  .bar{animation:growBar .5s ease-out both}
  .b1{animation-delay:.1s}.b2{animation-delay:.2s}.b3{animation-delay:.3s}.b4{animation-delay:.4s}
  @media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect width="380" height="240" rx="12" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>

<text x="24" y="44" font-size="36" font-weight="700" fill="#1a1a1a">₹14.4L</text>
<text x="24" y="62" font-size="9" fill="#00C853" font-weight="600">↑ 28% vs last year</text>
<text x="24" y="76" font-size="9" fill="#737373">Revenue tracked automatically</text>

<!-- Mini bar chart -->
<rect x="24" y="100" width="332" height="112" rx="8" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
<text x="36" y="118" font-size="8" font-weight="600" fill="#737373">Monthly Revenue</text>

<line x1="36" y1="196" x2="340" y2="196" stroke="#e8e8e8" stroke-width="1"/>

<!-- Bars -->
<rect x="54" y="156" width="36" height="40" rx="3" fill="#EBF3FF" class="bar b1"/>
<text x="72" y="206" font-size="7" fill="#999" text-anchor="middle">Jan</text>
<rect x="110" y="148" width="36" height="48" rx="3" fill="#EBF3FF" class="bar b2"/>
<text x="128" y="206" font-size="7" fill="#999" text-anchor="middle">Mar</text>
<rect x="166" y="140" width="36" height="56" rx="3" fill="#2170D9" class="bar b3"/>
<text x="184" y="206" font-size="7" fill="#999" text-anchor="middle">May</text>
<rect x="222" y="128" width="36" height="68" rx="3" fill="#2170D9" class="bar b4"/>
<text x="240" y="206" font-size="7" fill="#999" text-anchor="middle">Jun</text>

<text x="36" y="188" font-size="7" fill="#999">1L</text>
<text x="36" y="164" font-size="7" fill="#999">2L</text>
<text x="36" y="144" font-size="7" fill="#999">3L</text>

<text x="24" y="226" font-size="8" fill="#999">842 patients · 68% return rate · Real-time dashboard</text>
</svg>
