<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140">
<defs>
  <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#1e1b4b"/>
  </linearGradient>
  <linearGradient id="playG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
</defs>
<rect width="360" height="140" fill="url(#wbg)"/>

<!-- Screen showing webinar -->
<rect x="20" y="16" width="200" height="110" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

<!-- Presenter area -->
<rect x="28" y="24" width="184" height="86" rx="4" fill="rgba(0,0,0,0.3)"/>
<!-- Doctor silhouette -->
<circle cx="120" cy="52" r="14" fill="rgba(59,130,246,0.25)"/>
<circle cx="120" cy="47" r="5" fill="rgba(255,255,255,0.4)"/>
<path d="M108 66c0-6.6 5.4-8 12-8s12 1.4 12 8" fill="rgba(255,255,255,0.25)"/>

<!-- Webinar screen content -->
<rect x="36" y="72" width="108" height="30" rx="4" fill="rgba(59,130,246,0.15)"/>
<text x="44" y="84" font-size="7" font-weight="700" fill="white" font-family="-apple-system,sans-serif">Setting Up Recall</text>
<text x="44" y="95" font-size="6" fill="rgba(255,255,255,0.55)" font-family="-apple-system,sans-serif">Step 3: WhatsApp Templates</text>

<!-- Timeline bar -->
<rect x="28" y="106" width="184" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
<rect x="28" y="106" width="80" height="4" rx="2" fill="#3b82f6"/>
<circle cx="108" cy="108" r="4" fill="white"/>

<!-- Play button (paused) -->
<circle cx="190" cy="68" r="14" fill="rgba(255,255,255,0.08)"/>
<rect x="183" y="60" width="5" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>
<rect x="192" y="60" width="5" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>

<!-- Duration badge -->
<rect x="28" y="24" width="44" height="16" rx="4" fill="rgba(0,0,0,0.5)"/>
<text x="34" y="36" font-size="7.5" font-weight="700" fill="white" font-family="-apple-system,sans-serif">15 min</text>

<!-- Right side content -->
<text x="232" y="38" font-size="9.5" font-weight="700" fill="white" font-family="-apple-system,sans-serif">Live Walkthrough</text>
<text x="232" y="54" font-size="8.5" fill="rgba(255,255,255,0.45)" font-family="-apple-system,sans-serif">Recall setup in</text>
<text x="232" y="68" font-size="8.5" fill="rgba(255,255,255,0.45)" font-family="-apple-system,sans-serif">15 minutes flat.</text>
<text x="232" y="84" font-size="8.5" fill="rgba(255,255,255,0.45)" font-family="-apple-system,sans-serif">No developer.</text>
<text x="232" y="98" font-size="8.5" fill="rgba(255,255,255,0.45)" font-family="-apple-system,sans-serif">No coding.</text>

<!-- CTA pill -->
<rect x="232" y="108" width="88" height="20" rx="10" fill="url(#playG)"/>
<text x="254" y="122" font-size="8.5" font-weight="700" fill="white" font-family="-apple-system,sans-serif">▶  Watch Free</text>

</svg>
