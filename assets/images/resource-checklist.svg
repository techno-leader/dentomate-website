<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140">
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#eff6ff"/>
  </linearGradient>
</defs>
<rect width="360" height="140" fill="url(#cbg)"/>
<rect x="0" y="0" width="360" height="4" fill="#10b981"/>

<!-- Checklist items -->
<text x="20" y="28" font-size="10" font-weight="700" fill="#0f172a" font-family="-apple-system,sans-serif">5-Minute Setup Checklist</text>

<!-- Item 1: checked -->
<circle cx="32" cy="50" r="9" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<path d="M27 50l3 3 6-6" stroke="#059669" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="44" width="120" height="6" rx="3" fill="#10b981" opacity="0.4"/>
<text x="48" y="52" font-size="9" fill="#0f172a" font-weight="500" font-family="-apple-system,sans-serif">Add clinic name &amp; logo</text>

<!-- Item 2: checked -->
<circle cx="32" cy="72" r="9" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<path d="M27 72l3 3 6-6" stroke="#059669" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="76" font-size="9" fill="#0f172a" font-weight="500" font-family="-apple-system,sans-serif">Connect WhatsApp number</text>

<!-- Item 3: checked -->
<circle cx="32" cy="94" r="9" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<path d="M27 94l3 3 6-6" stroke="#059669" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="98" font-size="9" fill="#0f172a" font-weight="500" font-family="-apple-system,sans-serif">Add 3 patients</text>

<!-- Item 4: pending -->
<circle cx="32" cy="116" r="9" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="48" y="120" font-size="9" fill="#64748b" font-family="-apple-system,sans-serif">Send first prescription ✨</text>

<!-- Right side: time callout -->
<rect x="230" y="24" width="110" height="88" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="255" y="56" font-size="28" font-weight="700" fill="#10b981" font-family="-apple-system,sans-serif">5</text>
<text x="246" y="72" font-size="9" fill="#64748b" font-family="-apple-system,sans-serif">minutes to</text>
<text x="246" y="84" font-size="9" fill="#64748b" font-family="-apple-system,sans-serif">go live</text>
<rect x="244" y="94" width="82" height="14" rx="7" fill="#d1fae5"/>
<text x="256" y="105" font-size="8" font-weight="600" fill="#065f46" font-family="-apple-system,sans-serif">No dev needed</text>

</svg>
