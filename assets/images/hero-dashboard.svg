<text x="48" y="60" font-size="11" font-weight="700" fill="#1a1a1a">Dentomate</text>
<text x="48" y="72" font-size="8.5" fill="#999">SmileCraft Dental</text>
<line x1="0" y1="86" x2="200" y2="86" stroke="#f0f0f0" stroke-width="1"/>

<!-- Nav items -->
