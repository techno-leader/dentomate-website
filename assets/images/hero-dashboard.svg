<!-- Notification toast -->
<g class="notif">
  <rect x="430" y="400" width="240" height="44" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" filter="url(#sh)"/>
  <rect x="442" y="412" width="20" height="20" rx="5" fill="#25D366"/>
  <text x="452" y="425" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">✓</text>
