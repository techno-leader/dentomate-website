<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
<defs>
  <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <style>
    @keyframes slideNotif {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .notif { animation: none; opacity: 1; }
      .pulse  { animation: none; }
    }
    .notif {
      animation: slideNotif 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both;
    }
    .pulse {
      animation: pulseDot 2s ease-in-out 1.6s infinite;
    }
  </style>
</defs>

