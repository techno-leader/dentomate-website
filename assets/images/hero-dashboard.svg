<circle cx="22" cy="448" r="8" fill="#EBF3FF"/>
<text x="22" y="452" font-size="7.5" font-weight="700" fill="#2170D9" text-anchor="middle">DR</text>
<text x="36" y="446" font-size="9" font-weight="600" fill="#1a1a1a">Dr. Arjun Mehta</text>
