<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
<style>
  text { font-family: Inter, -apple-system, sans-serif; }
  @keyframes slideNotif {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes pulseDot { 0%,100%{opacity:1}50%{opacity:0.3} }
  .notif { animation: slideNotif 0.5s cubic-bezier(0.16,1,0.3,1) 1.2s both; }
  .pulse  { animation: pulseDot 2s ease-in-out 1.8s infinite; }
  @media (prefers-reduced-motion:reduce){.notif{animation:none;opacity:1}.pulse{animation:none}}
</style>
<defs>
  <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgb(17,17,26)" flood-opacity="0.10"/></filter>
  <clipPath id="clip"><rect width="760" height="460" rx="12"/></clipPath>
</defs>

<!-- Browser chrome -->
<rect width="760" height="460" rx="12" fill="#1e1e1e"/>
<rect x="0" y="0" width="760" height="36" rx="12" fill="#2d2d2d"/>
<rect x="0" y="24" width="760" height="12" fill="#2d2d2d"/>
<circle cx="16" cy="18" r="5" fill="#ff5f57"/>
<circle cx="32" cy="18" r="5" fill="#ffbd2e"/>
<circle cx="48" cy="18" r="5" fill="#28c840"/>
<rect x="200" y="8" width="360" height="20" rx="6" fill="#3a3a3a"/>
<text x="380" y="22" font-size="10" fill="#888" text-anchor="middle">app.dentomate.in / dashboard</text>

<!-- App bg -->
<rect x="0" y="36" width="760" height="424" fill="#fafafa" clip-path="url(#clip)"/>

